<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | ElasTitam</title>
    <!--FONTE POPPINS DO GOOGLE-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!--FONTE LATO DO GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <header class="header">
    <a href="#" class="header__logo"><img src="img_elastitam/logoElasTitam.png" alt="ElasTitam – Girls in tech"></a>
    <nav class="nav" aria-label="Principal">
      <a href="#">Home</a>
      <a href="#">Sobre</a>
      <a href="#">Atividades</a>
      <a href="#">Vozes</a>
      <a href="#">Comunidade</a>
      <a href="#">Contato</a>
      <a href="#">Relatório</a>
    </nav>
  </header>

  <main class="login">
    <section class="login__panel">
      <div class="form-wrap">
        <h1>Bem-vinda de volta!</h1>
        <p class="lead">Continue acompanhando a sua jornada<br>com o ElasTitam.</p>

        <div class="tabs">
          <a href="#" class="tab"><i class="fa-solid fa-circle-user"></i> Criar conta</a>
          <a href="#" class="tab tab--active" aria-current="page"><i class="fa-solid fa-circle-user"></i> Entrar</a>
        </div>

        <form class="form" action="#" method="post">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          </div>

          <a href="#" class="forgot">Esqueci minha senha</a>

          <button type="submit" class="btn">Criar minha conta</button>

          <p class="signup-link">Ainda não possui uma conta? <a href="#">Cadastre-se</a></p>
        </form>
      </div>
    </section>

    <div class="login__media">
      <img src="img_elastitam/backgroundLogin.png" alt="Três participantes do ElasTitam sorrindo e mostrando seus crachás da Semana de Empoderamento">
    </div>
  </main>

  <footer class="footer"></footer>

</body>
</html>
