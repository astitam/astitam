  <main class="signup">
    <div class="signup__media">
      <img src="img_elastitam/backgroundCadastro.png" alt="Participantes de uma oficina do ElasTitam montando um quebra-cabeça em sala de aula">
    </div>

    <section class="signup__panel">
      <div class="form-wrap">
        <h1>Crie sua conta</h1>
        <p class="lead">Junte-se ao ElasTitam e acompanhe tudo que acontece na nossa comunidade.</p>

        <div class="tabs">
          <a href="cadastro.html" class="tab tab--active" aria-current="page"><i class="fa-solid fa-circle-user"></i> Criar conta</a>
          <a href="login.html" class="tab"><i class="fa-solid fa-circle-user"></i> Entrar</a>
        </div>

        <form class="form" action="#" method="post">
          <div class="field">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="confirmar">Confirmar Senha</label>
            <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>
          </div>

          <label class="check">
            <input type="checkbox" name="novidades">
            <span>Aceito receber novidades e informações sobre atividades do ElasTitam.</span>
          </label>

          <button type="submit" class="btn">Criar minha conta</button>

          <div class="divider"><span>ou</span></div>
          <p class="login">Já possui conta? <a href="login.html">Entrar</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
