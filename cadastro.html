<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crie sua conta | ElasTitam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

  <header class="header">
    <a href="#" class="header__logo"><img src="img_elastitam/logoElasTitam.png" alt="ElasTitam – Girls in tech"></a>
    <nav class="nav" aria-label="Principal">
      <a href="#">Home</a>
      <a href="#">Sobre</a>
      <a href="#">Atividades</a>
      <a href="#">Vozes</a>
      <a href="#">Comunidade</a>
      <a href="#">Contato</a>
      <a href="#">Relatório</a>
    </nav>
  </header>

  <main class="signup">
    <div class="signup__media">
      <img src="img_elastitam/backgroundCadastro.png" alt="Participantes de uma oficina do ElasTitam montando um quebra-cabeça em sala de aula">
    </div>

    <section class="signup__panel">
      <div class="form-wrap">
        <h1>Crie sua conta</h1>
        <p class="lead">Junte-se ao ElasTitam e acompanhe tudo que acontece na nossa comunidade.</p>

        <div class="tabs">
          <a href="#" class="tab tab--active" aria-current="page"><i class="fa-solid fa-circle-user"></i> Criar conta</a>
          <a href="#" class="tab"><i class="fa-solid fa-circle-user"></i> Entrar</a>
        </div>

        <form class="form" action="#" method="post">
          <div class="field">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="confirmar">Confirmar Senha</label>
            <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>
          </div>

          <label class="check">
            <input type="checkbox" name="novidades">
            <span>Aceito receber novidades e informações sobre atividades do ElasTitam.</span>
          </label>

          <button type="submit" class="btn">Criar minha conta</button>

          <div class="divider"><span>ou</span></div>
          <p class="login">Já possui conta? <a href="#">Entrar</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>

</body>
</html>
